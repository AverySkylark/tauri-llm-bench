[package]
name = "bench_task"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

# Identical for every task so all attempts share one pre-built dependency cache.
# `test` gives Tauri's mock runtime: real IPC, events and channels without a WebView.
[dependencies]
tauri = { version = "=2.12.4", default-features = false, features = ["test"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
