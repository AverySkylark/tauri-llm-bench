# Benchmark matrix. Bump `version` on any change; the run record stores a hash of this file's content.
version: 3
suite_version: 1.0.0
price_table: v1
defaults:
  reps: 3
  max_retries: 2              # compile/test error feedback rounds
  max_output_tokens: 16000
  max_output_tokens_by_effort:  # thinking counts against the cap; 16k capped haiku@high on task C (v1)
    high: 32000
    max: 32000
  temperature: provider_default
  timeout_s: 600
  usd_ceiling_per_run: 1.00
  value_index:
    latency_usd_per_hour: 60  # λ in VI_t = Q / (C + λ·T)
    min_quality: 0.6
    min_pass_wilson_lower: 0.4

# Local model/effort choice for the owner's coding: Haiku at two efforts, Sonnet at every effort.
pairs:
  - provider: anthropic
    model: claude-haiku-5-5
    efforts: [low, high]
  - provider: anthropic
    model: claude-sonnet-5-5
    efforts: [none, low, medium, high, max]
